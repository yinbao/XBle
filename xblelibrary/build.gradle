apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion 35
    namespace 'com.xing.xblelibrary'

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 35
        versionCode 10
        versionName "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // AGP 8+：声明要发布的 variant，供 maven-publish 使用
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

task clearJar(type: Delete) {
    delete 'build/outputs/jar/XBleLibrary.jar'
}

task makeJar(type: Copy) {
    from('build/intermediates/aar_main_jar/release/')
    into('build/outputs/jar/')
    include('classes.jar')
    rename('classes.jar', 'XBleLibrary.jar')
}
makeJar.dependsOn(clearJar, build)

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.annotation:annotation:1.2.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}

// JitPack：./gradlew clean -Pgroup=... -Pversion=... publishToMavenLocal
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                // JitPack 构建时会传入 -Pgroup / -Pversion
                groupId = project.findProperty('group') ?: 'com.github.yinbao'
                // 与 README 中 com.github.yinbao:XBle 一致
                artifactId = 'XBle'
                version = project.findProperty('version') ?: android.defaultConfig.versionName
            }
        }
    }
}
